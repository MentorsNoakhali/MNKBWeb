<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gallery — Photos and memories from Mentors' Noakhali Branch events, activities, and campus life."
    />
    <meta
      name="keywords"
      content="Mentors Noakhali gallery, events photos, campus life, Mentors Noakhali branch events"
    />
    <meta property="og:title" content="Gallery | Mentors' Noakhali Branch" />
    <meta
      property="og:description"
      content="Browse photos and memories from Mentors' Noakhali Branch events, activities, and campus life."
    />
    <title>Gallery | Mentors' Noakhali Branch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/x-icon" href="Media/favicon.ico" />
    <style>
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
      }

      .folder-card {
        background: var(--surface);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        overflow: hidden;
        transition: var(--transition);
        text-decoration: none;
        color: inherit;
        display: block;
      }

      .folder-card:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow-lg);
        border-color: var(--accent);
      }

      .folder-card-thumb {
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        display: block;
        background: var(--surface-2);
      }

      .folder-card-info {
        padding: 20px;
      }

      .folder-card-icon {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .folder-card-icon svg {
        color: var(--accent);
        flex-shrink: 0;
      }

      .folder-card h3 {
        font-size: 1.15rem;
        color: var(--text-main);
        margin-bottom: 6px;
      }

      .folder-card p {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0;
      }

      .folder-card-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border-color);
        font-size: 0.82rem;
        color: var(--text-muted);
      }

      .folder-card-meta svg {
        width: 14px;
        height: 14px;
      }

      .gallery-empty {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
      }

      .gallery-empty svg {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        opacity: 0.4;
      }

      /* Lightbox */
      .lightbox-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        backdrop-filter: blur(6px);
        z-index: 3000;
        align-items: center;
        justify-content: center;
        padding: 40px;
      }

      .lightbox-overlay.active {
        display: flex;
      }

      .lightbox-close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1.5rem;
        transition: var(--transition);
        z-index: 10;
      }

      .lightbox-close:hover {
        background: var(--accent);
        border-color: var(--accent);
      }

      .lightbox-content {
        width: 90vw;
        height: 85vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        overflow: hidden;
      }

      .lightbox-title {
        color: white;
        font-family: "Outfit", sans-serif;
        font-size: 1.4rem;
        font-weight: 700;
        flex-shrink: 0;
      }

      .lightbox-images {
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        width: 100%;
        padding: 10px 0;
        flex: 1;
        min-height: 0;
      }

      .lightbox-images img {
        max-width: 100%;
        max-height: 80vh;
        border-radius: 12px;
        object-fit: contain;
        flex-shrink: 0;
      }

      @media (max-width: 768px) {
        .lightbox-overlay {
          padding: 16px;
        }

        .lightbox-images img {
          max-height: 70vh;
        }
      }
    </style>
  </head>

  <body>
    <nav class="navbar" id="navbar">
      <!-- Navbar injected by js/components.js -->
    </nav>

    <div class="page-hero">
      <div class="container">
        <h1>Our <em>Gallery</em></h1>
        <p>
          Browse photos and memories from our events, activities, and campus
          life at Mentors' Noakhali Branch.
        </p>
      </div>
    </div>

    <section class="section-padding" style="background: var(--bg-light)">
      <div class="container" style="max-width: 1100px; margin: auto">
        <div class="gallery-grid" id="gallery-grid">
          <div class="gallery-empty">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <p>Loading gallery...</p>
          </div>
        </div>
      </div>
    </section>

    <div class="lightbox-overlay" id="lightbox">
      <button class="lightbox-close" id="lightbox-close">&times;</button>
      <div class="lightbox-content">
        <div class="lightbox-title" id="lightbox-title"></div>
        <div class="lightbox-images" id="lightbox-images"></div>
      </div>
    </div>

    <footer class="footer">
      <!-- Footer injected by js/components.js -->
    </footer>

    <div class="floating-action-group">
      <!-- Buttons injected by js/components.js -->
    </div>

    <script src="js/components.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/seo.js"></script>
    <script>
      const GALLERY_FOLDERS = [
        {
          name: "Sports Day 02.07.2026",
          path: "Media/Events/Sports Day 02.07.2026",
          description:
            "Highlights from our Sports Day celebration — fun, fitness, and team spirit.",
          date: "2 July 2026",
          images: [
            "735222766_1509133377573145_3956858816929834417_n.jpeg",
            "735810405_1491257348968183_6639228961891166922_n.jpeg",
            "736659139_2265348977583748_7052496334217228347_n.jpeg",
          ],
        },
      ];

      function renderGallery() {
        const grid = document.getElementById("gallery-grid");

        if (!GALLERY_FOLDERS.length) {
          grid.innerHTML = `
            <div class="gallery-empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <p>No gallery folders yet. Check back soon!</p>
            </div>`;
          return;
        }

        grid.innerHTML = GALLERY_FOLDERS.map(
          (folder, i) => `
        <div class="folder-card" onclick="openLightbox(${i})">
          <img class="folder-card-thumb" src="${folder.path}/${folder.images[0]}" alt="${folder.name}" loading="lazy" />
          <div class="folder-card-info">
            <div class="folder-card-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              <h3>${folder.name}</h3>
            </div>
            <p>${folder.description}</p>
            <div class="folder-card-meta">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>${folder.images.length} photo${folder.images.length !== 1 ? "s" : ""}</span>
              <span>&middot;</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span>${folder.date}</span>
            </div>
          </div>
        </div>`
        ).join("");
      }

      const lightbox = document.getElementById("lightbox");
      const lightboxTitle = document.getElementById("lightbox-title");
      const lightboxImages = document.getElementById("lightbox-images");

      function openLightbox(index) {
        const folder = GALLERY_FOLDERS[index];
        lightboxTitle.textContent = folder.name;
        lightboxImages.innerHTML = folder.images
          .map(img => `<img src="${folder.path}/${img}" alt="${folder.name}" loading="lazy" />`)
          .join("");
        lightbox.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeLightbox() {
        lightbox.classList.remove("active");
        document.body.style.overflow = "";
      }

      document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLightbox();
      });

      renderGallery();
    </script>
  </body>
</html>
